services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kewaflow_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true
    volumes:
      # Mount host directory for hot-reloading code changes
      - .:/app
      # Named volumes to keep node_modules and .next cache strictly inside Docker
      # and prevent ANY downloads or build files on the host machine
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next

volumes:
  app_node_modules:
    name: kewaflow_node_modules
  app_next_cache:
    name: kewaflow_next_cache
